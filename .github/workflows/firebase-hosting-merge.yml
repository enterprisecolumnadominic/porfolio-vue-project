name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main

jobs:
  build_test_and_deploy:
    name: Run Playwright Tests & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment with caching for faster runs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 3. Cleanly install project dependencies
      - name: Install Project Dependencies
        run: npm ci

      # 4. Install Playwright browser engines and system dependencies
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Run Playwright E2E Tests (Gatekeeper step)
      - name: Run Playwright E2E Tests
        run: npx playwright test

      # 6. Build the production bundle (Runs only if tests pass)
      - name: Build Application
        run: npm run build

      # 7. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSE_PROJ_FFF2A }}"
          projectId: house-proj-fff2a
          target: portfolio-site
          channelId: live
